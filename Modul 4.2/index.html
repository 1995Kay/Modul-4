<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="quiz-container">
      <!-- IDs hinzugefügt, damit JavaScript den Text austauschen kann -->
      <h1 class="question" id="question-text">Frage lädt...</h1>

      <!-- Dieser Container ist jetzt leer. JS wirft die Buttons hier hinein. -->
      <div class="answers" id="answers-container"></div>

      <div class="footer-actions">
        <button class="action-btn" onclick="showSolution()">Lösung</button>
        <button class="action-btn" onclick="nextQuestion()">Weiter</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
